name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test tools
        run: python -m pip install pytest pytest-cov ruff==0.15.22 build jsonschema
      - name: Ruff
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Unit tests and coverage
        run: pytest --cov=membrane_vqc --cov=scripts --cov-report=term-missing --cov-report=xml
      - name: Validate example reports against schema
        run: python scripts/validate_example_reports.py
      - name: Build Python package
        run: python -m build
      - name: Build and validate Plugin Manager ZIP
        run: |
          mkdir -p .local/determinism
          python scripts/build_plugin_zip.py --output .local/determinism/first.zip
          python scripts/build_plugin_zip.py --output .local/determinism/second.zip
          cmp --silent .local/determinism/first.zip .local/determinism/second.zip
          python scripts/build_plugin_zip.py
          python scripts/build_plugin_zip.py --validate dist/MembraneVisualQC-1.0.0.zip
      - name: Validate current development artifacts
        run: python scripts/validate_release_artifacts.py --mode current-development
      - name: Guard frozen historical evidence
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git merge-base HEAD origin/${{ github.event.repository.default_branch }})"
          fi
          python scripts/check_frozen_evidence_diff.py --base "$BASE_SHA"
      - name: Verify frozen v0.4.0 evidence
        run: python scripts/validate_release_artifacts.py --mode frozen-v0.4.0
      - name: Verify frozen v0.5.0 evidence
        run: python scripts/validate_release_artifacts.py --mode frozen-v0.5.0
      - name: Verify frozen v0.6.0 evidence
        run: python scripts/validate_release_artifacts.py --mode frozen-v0.6.0
      - name: Verify frozen v0.7.0 evidence
        run: python scripts/validate_release_artifacts.py --mode frozen-v0.7.0
      - name: Verify frozen v0.8.0 evidence
        run: python scripts/validate_release_artifacts.py --mode frozen-v0.8.0
      - name: Verify frozen v0.9.0 evidence
        run: python scripts/validate_release_artifacts.py --mode frozen-v0.9.0
      - name: Verify frozen v1.0.0rc1 evidence
        run: python scripts/validate_release_artifacts.py --mode frozen-v1.0.0rc1
      - name: Upload release-build inputs
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: membrane-vqc-build
          path: |
            dist/MembraneVisualQC-1.0.0.zip
            dist/MembraneVisualQC-1.0.0.zip.sha256
            dist/membrane_vqc_pymol-1.0.0-py3-none-any.whl
            dist/membrane_vqc_pymol-1.0.0.tar.gz

  freesasa-reference:
    name: FreeSASA reference (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install optional reference backend
        run: python -m pip install -e ".[exposure-reference]" pytest
      - name: Run FreeSASA availability and parity tests
        run: pytest tests/test_freesasa_backend.py

  stage4b-windows-core:
    name: Stage 4/5 Windows core (Python 3.10)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install focused test tools
        run: python -m pip install pytest pytest-cov jsonschema PyQt5==5.15.11
      - name: Verify Windows runtime
        run: python -c "import platform, struct; assert platform.python_version_tuple()[:2] == ('3', '10'); assert struct.calcsize('P') == 8"
      - name: Run Stage 4 transport/cache and Stage 5 batch filesystem gates
        env:
          HTTP_PROXY: http://user:secret@proxy.invalid:8080
          HTTPS_PROXY: http://user:secret@proxy.invalid:8080
          ALL_PROXY: http://user:secret@proxy.invalid:8080
          NO_PROXY: credential-sentinel.invalid
          MVQC_CACHE_DIR: ${{ runner.temp }}\mvqc-stage4b1-cache
        run: >-
          pytest
          tests/test_pdbtm_transport.py
          tests/test_pdbtm_cache_contract.py
          tests/test_pdbtm_provider.py
          tests/test_pdbtm_cache.py
          tests/test_pdbtm_retrieval.py
          tests/test_pdbtm_report_provenance.py
          tests/test_stage4b1_windows.py
          tests/test_stage4b1_package_safety.py
          tests/test_pdbtm_worker.py
          tests/test_pdbtm_gui_worker.py
          tests/test_gui_pdbtm_cached.py
          tests/test_commands_pdbtm_cached.py
          tests/test_stage4b3_package_safety.py
          tests/test_opm_adapter.py
          tests/test_orientation_comparison.py
          tests/test_comparison_report.py
          tests/test_comparison_worker.py
          tests/test_comparison_gui_worker.py
          tests/test_comparison_pymol.py
          tests/test_gui_comparison.py
          tests/test_stage4c_package_safety.py
          tests/test_batch_contracts.py
          tests/test_batch_result.py
          tests/test_batch_runner.py
          tests/test_batch_executor.py
          tests/test_stage5a_example.py
          tests/test_batch_step_session.py
          tests/test_batch_result_browser.py
          tests/test_batch_gui.py
          tests/test_batch_gui_real_qt.py
          tests/test_ui_components_real_qt.py
          tests/test_batch_paths.py
